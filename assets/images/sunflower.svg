<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sunflowerStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba082"/>
      <stop offset="100%" stop-color="#697a62"/>
    </linearGradient>
    <linearGradient id="sunflowerPetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fad06c"/>
      <stop offset="60%" stop-color="#f5b338"/>
      <stop offset="100%" stop-color="#df8e1d"/>
    </linearGradient>
    <linearGradient id="sunflowerPetalBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a82c"/>
      <stop offset="100%" stop-color="#c97712"/>
    </linearGradient>
    <radialGradient id="sunflowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#422918"/>
      <stop offset="65%" stop-color="#331c0e"/>
      <stop offset="90%" stop-color="#4a2d1a"/>
      <stop offset="100%" stop-color="#6e4627"/>
    </radialGradient>
    <filter id="softSunShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#df8e1d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stem -->
  <path d="M 100 100 Q 98 160 102 230" fill="none" stroke="url(#sunflowerStem)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Leaf -->
  <path d="M 100 180 Q 55 160 60 125 Q 85 145 101 170 Z" fill="#788c70" opacity="0.9"/>
  <!-- Right Leaf -->
  <path d="M 101 195 Q 145 175 140 140 Q 115 160 101 185 Z" fill="#6f8267" opacity="0.85"/>

  <!-- Sunflower Flower Head -->
  <g transform="translate(100, 100)" filter="url(#softSunShadow)">
    <!-- Back Row Petals (Rotated) -->
    <g fill="url(#sunflowerPetalBack)">
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(15)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(45)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(75)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(105)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(135)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(165)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(195)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(225)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(255)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(285)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(315)"/>
      <ellipse cx="0" cy="-48" rx="8" ry="24" transform="rotate(345)"/>
    </g>

    <!-- Front Row Petals -->
    <g fill="url(#sunflowerPetalGrad)">
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(0)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(30)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(60)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(90)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(120)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(150)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(180)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(210)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(240)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(270)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(300)"/>
      <ellipse cx="0" cy="-45" rx="9" ry="22" transform="rotate(330)"/>
    </g>

    <!-- Center Disc -->
    <circle cx="0" cy="0" r="26" fill="url(#sunflowerCenter)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#754724" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#a16639" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  </g>
</svg>
