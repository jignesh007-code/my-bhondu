    <circle cx="490" cy="355" r="12" fill="#c87d68" stroke="none"/>
    <circle cx="310" cy="355" r="8" stroke="#6e5d4f" stroke-width="3"/>
    
    <!-- Little Sparkles & Heart -->
    <path d="M 230 290 Q 230 270 210 270 Q 230 270 230 250 Q 230 270 250 270 Q 230 270 230 290 Z" fill="#d99e4b" stroke="none"/>
    <path d="M 570 480 Q 570 465 555 465 Q 570 465 570 450 Q 570 465 585 465 Q 570 465 570 480 Z" fill="#d99e4b" stroke="none"/>
    
